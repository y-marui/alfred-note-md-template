name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: macos-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Only on an actual version tag: workflow_dispatch from a branch is for
      # exercising the build without publishing anything, and has no tag to
      # check against.
      - name: Verify tag matches workflow/info.plist version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PLIST_VERSION=$(/usr/libexec/PlistBuddy -c "Print :version" workflow/info.plist)
          if [ "$TAG_VERSION" != "$PLIST_VERSION" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match workflow/info.plist version ${PLIST_VERSION}" >&2
            exit 1
          fi

      # Signing/notarization only runs for an actual version tag: it needs
      # secrets that only make sense for a real release, and workflow_dispatch
      # is for exercising the build on a branch without publishing anything.
      - name: Import signing certificate
        if: startsWith(github.ref, 'refs/tags/')
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="${RUNNER_TEMP}/release-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "${RUNNER_TEMP}/certificate.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "${RUNNER_TEMP}/certificate.p12" -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # shellcheck disable=SC2046 # intentional word-splitting: adds the
          # new keychain to the user's existing search list, not just one path
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | tr -d '"')
          rm -f "${RUNNER_TEMP}/certificate.p12"

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "::error::no Developer ID Application identity found in the imported certificate" >&2
            exit 1
          fi
          {
            echo "CODESIGN_IDENTITY=$IDENTITY"
            echo "RELEASE_KEYCHAIN_PATH=$KEYCHAIN_PATH"
          } >> "$GITHUB_ENV"

      - name: Import notarization API key
        if: startsWith(github.ref, 'refs/tags/')
        env:
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
        run: |
          KEY_PATH="${RUNNER_TEMP}/notary-key.p8"
          printf '%s' "$NOTARY_API_KEY" | base64 --decode > "$KEY_PATH"
          {
            echo "NOTARY_API_KEY_PATH=$KEY_PATH"
            echo "NOTARY_KEY_ID=${{ secrets.NOTARY_KEY_ID }}"
            echo "NOTARY_ISSUER_ID=${{ secrets.NOTARY_ISSUER_ID }}"
          } >> "$GITHUB_ENV"

      - name: Build .alfredworkflow
        run: make build-workflow

      - name: Clean up signing credentials
        if: always()
        run: |
          if [ -n "${RELEASE_KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$RELEASE_KEYCHAIN_PATH"
          fi
          rm -f "${NOTARY_API_KEY_PATH:-}"

      - name: Checksums
        working-directory: dist
        run: shasum -a 256 *.alfredworkflow > checksums.txt

      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*.alfredworkflow"

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          NOTES=$(scripts/extract-changelog.sh "${{ github.ref_name }}")
          gh release create "${{ github.ref_name }}" dist/*.alfredworkflow dist/checksums.txt \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --notes "$NOTES"
