name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  security:
    name: Security scan (pre-commit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pre-commit/action@v3.0.1
        env:
          # powershell-lint is a local-only convenience check (see
          # .pre-commit-config.yaml); it isn't required to gate merges.
          SKIP: powershell-lint

  build:
    name: Build
    needs: [security]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: echo "All checks passed"
